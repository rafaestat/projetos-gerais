<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a120b" />
  <title>Ateliê Essenzia — O Simulador Tátil de ASMR</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ateliê Essenzia" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Tela inicial: convite suave para usar fones de ouvido -->
  <div id="intro" class="overlay">
    <div class="intro-inner">
      <div class="brand">
        <img class="brand-icon" src="icon.svg" alt="Ateliê Essenzia" width="96" height="96" />
        <h1>Ateliê Essenzia</h1>
        <p class="subtitle">O Simulador Tátil de ASMR</p>
      </div>
      <p class="intro-text">
        Um espaço sem pressa. Sem relógios, sem metas, sem erros.<br />
        Apenas o prazer de criar com as mãos.
      </p>
      <p class="intro-hint">🎧 Use fones de ouvido para a imersão completa.</p>
      <button id="beginBtn" class="begin-btn">Entrar no ateliê</button>
    </div>
  </div>

  <!-- Canvas principal onde tudo acontece -->
  <canvas id="stage"></canvas>

  <!-- UI mínima que some durante a criação -->
  <button id="backBtn" class="chip-btn back-btn" aria-label="Voltar ao ateliê">‹ ateliê</button>
  <button id="muteBtn" class="chip-btn mute-btn" aria-label="Silenciar">
    <svg class="ico-on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
      <path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <svg class="ico-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
      <path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="hint" class="hint"></div>

  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/affordance.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
