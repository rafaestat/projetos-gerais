<title>Alerta de Golpe Pix</title>
<style>
/* Layout: celular centralizado + painel "Por que essa tela" logo abaixo, com a evidência de cada etapa.
   Telas normais seguem tokens públicos do DS PicPay; a Camada 2 rompe a marca de propósito (polimórfica). */
:root{
  --green:#21C25E; --green-press:#1AA34E; --green-text:#15803D; --green-soft:#E6F9ED;
  --bg:#F5F7FA; --surface:#FFFFFF; --text:#1A1A1A; --muted:#6B7280; --line:#E5E7EB;
  --amber-text:#B45309; --amber-soft:#FEF3C7;
  --scrim:rgba(0,0,0,.56); --shadow:0 8px 24px rgba(0,0,0,.12);
  --font:"PicPay Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-l:16px; --r-xl:24px; --pill:999px; --touch:48px; --m:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --green:#21C25E; --green-press:#1AA34E; --green-text:#4CD97F; --green-soft:#173A2A;
  --bg:#12121C; --surface:#22222E; --text:#FFFFFF; --muted:#C4C8D0; --line:#3A3A48;
  --amber-text:#FCD34D; --amber-soft:#3A2E12; --scrim:rgba(0,0,0,.72); color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#21C25E; --green-press:#1AA34E; --green-text:#4CD97F; --green-soft:#173A2A;
  --bg:#12121C; --surface:#22222E; --text:#FFFFFF; --muted:#C4C8D0; --line:#3A3A48;
  --amber-text:#FCD34D; --amber-soft:#3A2E12; --scrim:rgba(0,0,0,.72); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 var(--font);padding:16px;padding-block:12px 40px}
.wrap{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
p{margin:0} h1,h2{margin:0;font-weight:700;line-height:1.2;text-wrap:balance}
h1{font-size:28px} h2{font-size:22px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--green-text);outline-offset:2px}

/* Celular */
.phone{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:28px;min-height:min(720px,calc(100vh - 120px));display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 8px 0}
.top button{background:none;border:0;min-width:var(--touch);min-height:var(--touch);border-radius:var(--pill);font-size:22px}
.top span{font-weight:700}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;padding:8px var(--m) 20px}
.grow{flex:1}
.muted{color:var(--muted)}

/* Botões */
.btn{width:100%;min-height:var(--touch);border-radius:var(--pill);padding:12px 20px;font-weight:700;border:2px solid transparent}
.b-primary{background:var(--green);color:#1A1A1A}
.b-primary:active{background:var(--green-press)}
.b-secondary{background:transparent;border-color:var(--green);color:var(--green-text)}
.b-text{background:none;color:var(--green-text);min-height:40px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:8px}

/* Pagamento */
.who{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green-text);font-weight:700;flex:none}
.amount{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.payee{border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:12px}
.flag{display:inline-flex;gap:6px;align-items:center;align-self:flex-start;padding:4px 10px;border-radius:var(--pill);background:var(--amber-soft);color:var(--amber-text);font-size:13px;font-weight:700}

/* Chips */
.q{display:flex;flex-direction:column;gap:8px}
.q b{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:var(--touch);padding:0 16px;border-radius:var(--pill);border:2px solid var(--line);background:transparent;font-weight:700}
.chip[aria-pressed="true"]{border-color:currentColor;background:rgba(127,127,127,.15)}
.chip[aria-pressed="true"]::before{content:"✓ "}

/* Segurar */
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hold i{position:absolute;inset:0;width:0;background:currentColor;opacity:.18}
.hold span{position:relative}

/* ---- Camada 2: três visuais que se alternam (alerta polimórfico) ---- */
.v-hazard{--alert-bg:#111111;--alert-fg:#FFFFFF;--alert-accent:#FFD60A;--alert-on-accent:#111111}
.v-red{--alert-bg:#B91C1C;--alert-fg:#FFFFFF;--alert-accent:#FFFFFF;--alert-on-accent:#B91C1C}
.v-paper{--alert-bg:#FFF7D6;--alert-fg:#1A1A1A;--alert-accent:#1A1A1A;--alert-on-accent:#FFD60A}
.alert{background:var(--alert-bg);color:var(--alert-fg)}
.alert .muted{color:inherit;opacity:.85}
.alert .b-primary{background:var(--alert-accent);color:var(--alert-on-accent)}
.alert .b-secondary{border-color:var(--alert-fg);color:var(--alert-fg)}
.alert .b-text{color:var(--alert-fg);text-decoration:underline}
.alert .chip{border-color:color-mix(in srgb,var(--alert-fg) 35%,transparent)}
.stripes{height:14px;flex:none;background:repeating-linear-gradient(-45deg,var(--alert-accent) 0 14px,transparent 14px 28px)}
.v-red .stripes,.v-paper .stripes{display:none}
.mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--alert-accent);color:var(--alert-on-accent)}
.v-paper .mark{border-radius:12px;transform:rotate(45deg)} .v-paper .mark svg{transform:rotate(-45deg)}
.big{font-size:34px;line-height:1.05;letter-spacing:-.02em}
.say{font-size:19px;font-weight:700}
.timer{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tip{border-radius:var(--r-l);padding:14px 16px;background:color-mix(in srgb,var(--alert-fg) 10%,transparent);font-weight:700}

/* Sheet de análise de print */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);color:var(--text);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow);padding:12px var(--m) 20px;display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
.sheet .b-primary{background:var(--green);color:#1A1A1A}
.sheet .b-text{color:var(--green-text);text-decoration:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sig{display:flex;gap:8px;align-items:flex-start}
.sig::before{content:"!";flex:none;width:22px;height:22px;border-radius:50%;background:#B91C1C;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}

/* Painel de evidência */
.why{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:8px}
.why h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.why p{font-size:15px}
.why a{color:var(--green-text);font-size:14px;font-weight:700}

/* Início */
.tier{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:16px;border:2px solid var(--line);border-radius:var(--r-l);background:transparent}
.tier small{color:var(--muted);font-size:14px}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:var(--touch);font-weight:700}
.toggle input{width:24px;height:24px;accent-color:var(--green-press)}

.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.shake,.sheet{animation:none}}
#hap{position:absolute;left:-9999px;opacity:0}
</style>

<div id="hap"><input type="checkbox" switch id="hapi"><label for="hapi" id="hapl">h</label></div>

<div class="wrap">
  <main class="phone" id="phone"></main>
  <aside class="why" id="why" aria-label="Por que essa tela"></aside>
</div>

<script>
const $ = id => document.getElementById(id);
const phone = $('phone'), why = $('why'), hapl = $('hapl');
const PIX = { nome:'Gabriel Costa Souza', primeiro:'Gabriel', ini:'GS', valor:'R$ 1.500,00', banco:'Banco Exemplo', chave:'Celular •••• 4471' };
const S = { tier:1, onCall:true, variant:0, a:{} };

/* ---------- Vibração ---------- */
// A web só controla a duração. "Forte" = pulsos longos e repetidos. iPhone: rajada de toques curtos (iOS 18+).
const canVibrate = typeof navigator.vibrate === 'function';
const V = { tap:20, check:[200,100,200], stop:[1000,100,1000,100,1000,100,1500], call:[1200,200,1200,200,1200], ok:[60,60,60] };
function vibrate(p){
  let ok=false; try{ if(canVibrate) ok=navigator.vibrate(p); }catch(e){}
  if(!ok){ const seq=[].concat(p); let t=0; seq.forEach((d,i)=>{ if(i%2===0) for(let k=0;k<Math.max(1,Math.round(d/50));k++) setTimeout(()=>{try{hapl.click()}catch(e){}},t+k*50); t+=d; }); }
  phone.classList.remove('shake'); void phone.offsetWidth; phone.classList.add('shake');
}
let alarmT=0;
function alarm(p){ stopAlarm(); let n=0; const go=()=>{ vibrate(p); if(++n<3) alarmT=setTimeout(go,7000); }; go(); phone.addEventListener('pointerdown',stopAlarm,{once:true}); }
function stopAlarm(){ clearTimeout(alarmT); try{ canVibrate&&navigator.vibrate(0); }catch(e){} }

/* ---------- Utilidades ---------- */
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const svg = d => `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  alert: svg('<path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.5h.01"/>'),
  phone: svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/><path d="M3 3l18 18"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')
};
function show(html, cls, evidence){
  stopAlarm();
  phone.className = 'phone ' + (cls||'');
  phone.innerHTML = html;
  phone.querySelectorAll('[data-back]').forEach(b=>b.onclick=home);
  why.innerHTML = `<h3>Por que essa tela</h3>${evidence}`;
  window.scrollTo(0,0);
}
const topBar = (t='') => `<div class="top"><button data-back aria-label="Voltar ao início">‹</button><span>${t}</span></div>`;
const chips = (id, list) => `<div class="chips" data-q="${id}">${shuffle(list).map(([v,l])=>`<button class="chip" aria-pressed="false" data-v="${v}">${l}</button>`).join('')}</div>`;
function onChips(cb){
  phone.querySelectorAll('.chips').forEach(g=>g.addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    g.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); S.a[g.dataset.q]=b.dataset.v; vibrate(V.tap); cb&&cb();
  }));
}
function hold(el, ms, done){
  const fill=el.querySelector('i'); let t0=0, raf=0;
  const step=ts=>{ const p=Math.min(1,(ts-t0)/ms); fill.style.width=p*100+'%'; if(p>=1){ end(); done(); } else raf=requestAnimationFrame(step); };
  const start=e=>{ e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(step); };
  const end=()=>{ cancelAnimationFrame(raf); fill.style.width='0'; };
  el.addEventListener('pointerdown',start); ['pointerup','pointerleave','pointercancel'].forEach(x=>el.addEventListener(x,end));
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); done(); } });
}
const src = (txt, href) => `<a href="${href}" target="_blank" rel="noopener">${txt} ↗</a>`;
const L = {
  notts: ['Nottingham / Open Banking UK, 2023','https://www.nottingham.ac.uk/cedex/documents/papers/cedex-discussion-paper-2023-08.pdf'],
  cba:   ['CommBank NameCheck','https://commbank.com.au/articles/newsroom/2024/08/cba-cuts-scam-losses-for-customers.html'],
  andr:  ['Android: proteção em ligação','https://www.androidauthority.com/android-in-call-scam-protection-us-expansion-3621618'],
  monzo: ['Monzo Call Status','https://android-developers.googleblog.com/2024/03/battling-impersonation-scams-monzo-innovative-approach.html?hl=id'],
  fos:   ['Ombudsman UK: respostas ditadas','https://www.financial-ombudsman.org.uk/decision/DRN-5949234.pdf'],
  byu:   ['BYU: alertas polimórficos','https://misq.umn.edu/pub/skin/frontend/default/misq/pdf/V42I2/14124_RA_VanceJenkins.pdf'],
  ukf:   ['UK Finance: Effective Warnings','https://www.thinksinsight.com/blog/uk-finance-effective-warnings-research'],
  feb:   ['Febraban 2025','https://seucreditodigital.com.br/golpes-em-contas-39-brasileiros-vitimas/'],
  star:  ['Starling Scam Intelligence','https://www.uktech.news/ai/starling-bank-launches-ai-tool-to-combat-scams-20251028'],
  med:   ['MED 2.0','https://dock.tech/fluid/blog/banking/med-2-0/']
};
const cite = (...keys) => keys.map(k=>src(...L[k])).join('');

/* ---------- Início ---------- */
function home(){
  S.a={};
  show(`<div class="top"><span style="padding-left:12px">Protótipo</span></div>
  <section class="screen">
    <h1>Simular alerta de golpe</h1>
    <div class="stack">
      <button class="tier" id="t1"><b>Risco ~1%</b><small>Confere rapidinho</small></button>
      <button class="tier" id="t2"><b>Risco ~10%</b><small>Pare</small></button>
    </div>
    <label class="toggle" for="call">Pessoa está numa ligação<input type="checkbox" id="call" ${S.onCall?'checked':''}></label>
    <div class="grow"></div>
    <button class="btn b-text" id="test">Testar vibração forte</button>
    <p class="muted" style="font-size:14px;text-align:center">${canVibrate?'Tire o celular do silencioso.':'No iPhone a vibração é fraca (iOS 18+).'}</p>
  </section>`, '',
  `<p>Mesmo Pix, dois níveis de risco. O atrito pesado fica só no risco alto: aplicado a todo pagamento, ele derrubou 14 p.p. dos pagamentos legítimos.</p>${cite('notts')}`);
  $('call').onchange=e=>S.onCall=e.target.checked;
  $('t1').onclick=()=>{ S.tier=1; pay(); };
  $('t2').onclick=()=>{ S.tier=2; pay(); };
  $('test').onclick=()=>vibrate(V.stop);
}

/* ---------- Pagamento ---------- */
function pay(){
  show(`${topBar('Pix')}<section class="screen">
    <div class="who"><div class="av">${PIX.ini}</div><div><b>${PIX.nome}</b><p class="muted">${PIX.chave}</p></div></div>
    <div><p class="muted">Valor</p><div class="amount">${PIX.valor}</div></div>
    <div class="grow"></div>
    <button class="btn b-primary" id="go">Pagar</button>
  </section>`, '',
  `<p>Tela de pagamento comum. O modelo de risco roda quando a pessoa toca em Pagar.</p>`);
  $('go').onclick = () => S.tier===1 ? check() : (S.onCall ? onCall() : stop());
}

/* ---------- Camada 1: confere rapidinho ---------- */
const POOL = [
  { id:'agora',   t:'Alguém tá te pedindo pra fazer isso agora?', o:[['s','Sim'],['n','Não']], risk:'s' },
  { id:'pressa',  t:'Disseram que é urgente?', o:[['s','Sim'],['n','Não']], risk:'s' },
  { id:'segredo', t:'Pediram pra não contar pra ninguém?', o:[['s','Sim'],['n','Não']], risk:'s' },
  { id:'numero',  t:`O ${PIX.primeiro} te pediu de um número novo?`, o:[['s','Sim'],['n','Não'],['x','Ele não pediu']], risk:'s' },
];
function check(){
  const q = POOL[Math.floor(Math.random()*POOL.length)];
  vibrate(V.check);
  show(`${topBar('Confere rapidinho')}<section class="screen">
    <h2>É pra essa pessoa mesmo?</h2>
    <div class="payee">
      <div class="who"><div class="av">${PIX.ini}</div><div><b>${PIX.nome}</b><p class="muted">${PIX.banco}</p></div></div>
      <span class="flag">Primeira vez que você paga</span>
      <div class="row"><span class="muted">Valor</span><b>${PIX.valor}</b></div>
    </div>
    <div class="q"><b>${q.t}</b>${chips(q.id,q.o)}</div>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn b-primary" id="pay" disabled>Pagar</button>
      <button class="btn b-secondary" id="later">Deixar pra amanhã</button>
      <button class="btn b-text" id="cancel">Cancelar</button>
    </div>
  </section>`, '',
  `<p><b>Confirmar o nome</b> do favorecido evitou A$ 40 mi em golpes no CommBank. <b>Botões de saída visíveis</b> foram a intervenção mais eficaz do estudo britânico: com alerta só no risco, −81% de golpes. A pergunta muda a cada vez.</p>${cite('cba','notts')}`);
  onChips(()=>{ $('pay').disabled=false; });
  $('pay').onclick = () => S.a[q.id]===q.risk ? (S.onCall ? onCall() : stop()) : done('paid');
  $('later').onclick = () => done('later');
  $('cancel').onclick = () => done('cancel');
}

/* ---------- Camada 2: ligação ativa ---------- */
const VARIANTS = ['v-hazard','v-red','v-paper'];
const TITLES   = ['Pare.','Pode ser golpe.','Calma aí.'];
function nextVariant(){ const v=VARIANTS[S.variant%3]; S.variant++; return v; }

function onCall(){
  const v = nextVariant();
  show(`<div class="stripes"></div>${topBar()}<section class="screen">
    <div class="mark">${ICON.phone}</div>
    <h1 class="big">Você está numa ligação.</h1>
    <p class="say">A gente não está te ligando.</p>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn b-primary" id="hang">Desligar a ligação</button>
      <button class="btn b-secondary" id="cancel">Cancelar Pix</button>
    </div>
  </section>`, 'alert '+v,
  `<p>Sinal do aparelho vale mais que resposta, porque golpistas <b>ditam o que a vítima deve responder</b>. O Android já faz isso em apps financeiros: alerta, <b>30s de pausa</b> e botão para encerrar a ligação. O Monzo mostra no app se o banco está mesmo ligando.</p>${cite('andr','monzo','fos')}`);
  alarm(V.call);
  $('cancel').onclick = () => done('cancel');
  $('hang').onclick = () => { S.onCall=false; pause30(v); };
}
function pause30(v){
  show(`<div class="stripes"></div>${topBar()}<section class="screen">
    <div class="mark">${ICON.clock}</div>
    <h1 class="big">Respira.</h1>
    <div class="timer" id="tm" role="timer">30</div>
    <p class="muted">Ninguém do banco pede Pix por telefone.</p>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn b-primary" id="cancel">Cancelar Pix</button>
      <button class="btn b-secondary" id="next" disabled>Continuar</button>
      <button class="btn b-text" id="skip">Pular espera (protótipo)</button>
    </div>
  </section>`, 'alert '+v,
  `<p>Os 30 segundos copiam o Android. O golpe depende de urgência, e tempo desmonta o roteiro.</p>${cite('andr')}`);
  let n=30; const tm=$('tm'), next=$('next');
  const iv=setInterval(()=>{ n--; tm.textContent=n; if(n<=0){ clearInterval(iv); next.disabled=false; } },1000);
  $('cancel').onclick=()=>{ clearInterval(iv); done('cancel'); };
  next.onclick=()=>{ clearInterval(iv); stop(v); };
  $('skip').onclick=()=>{ clearInterval(iv); stop(v); };
}

/* ---------- Camada 2: tela polimórfica ---------- */
function stop(v){
  v = v || nextVariant();
  show(`<div class="stripes"></div>${topBar()}<section class="screen">
    <div class="mark">${ICON.alert}</div>
    <h1 class="big">${TITLES[VARIANTS.indexOf(v)]}</h1>
    <p class="say">Se alguém te disse o que responder aqui, é golpe.</p>
    <div class="q"><b>Quem te pediu esse Pix?</b>${chips('quem',[['conhecido','Conhecido por mensagem'],['central','Banco ou central'],['vendedor','Vendedor'],['eu','Ninguém, fui eu']])}</div>
    <div class="q"><b>Pediram pressa ou segredo?</b>${chips('pressa',[['s','Sim'],['n','Não']])}</div>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn b-primary" id="cancel">Cancelar Pix</button>
      <button class="btn b-secondary" id="next" disabled>Continuar</button>
    </div>
  </section>`, 'alert '+v,
  `<p>Este alerta <b>muda de visual a cada vez</b> (3 versões: simule de novo para ver). Alertas polimórficos resistem à habituação, medida por fMRI e em campo. <b>Fugir da cor da marca</b> e fazer <b>perguntas específicas</b> cria a pausa cognitiva.</p>${cite('byu','ukf')}`);
  alarm(V.stop);
  onChips(()=>{ $('next').disabled = !(S.a.quem && S.a.pressa); });
  $('cancel').onclick = () => done('cancel');
  $('next').onclick = () => decide(v);
}

/* ---------- Camada 2: aviso sob medida + saídas claras ---------- */
const TIPS = {
  conhecido:`Liga pro ${PIX.primeiro} no número antigo antes de pagar.`,
  central:'Banco não pede Pix. É o golpe da falsa central.',
  vendedor:'Manda o print do anúncio que a gente confere.',
  eu:'Confere se o nome é de quem você espera.'
};
function decide(v){
  const risky = S.a.pressa==='s' || S.a.quem==='central';
  show(`<div class="stripes"></div>${topBar()}<section class="screen">
    <h2>${risky?'Tem cara de golpe.':'Última checada.'}</h2>
    <div class="tip">${TIPS[S.a.quem]}</div>
    <div class="grow"></div>
    <div class="stack">
      <button class="btn b-primary" id="cancel">Cancelar Pix</button>
      <button class="btn b-secondary" id="later">Agendar pra daqui 1h</button>
      <button class="btn b-secondary" id="print">Mandar print pra análise</button>
      <button class="btn b-text hold" id="pay"><i></i><span>Segure pra pagar mesmo assim</span></button>
    </div>
  </section>`, 'alert '+v,
  `<p>Aviso <b>sob medida</b> para o golpe provável, em uma frase. Os golpes mais comuns no Brasil são a falsa central (32%) e o falso conhecido no WhatsApp (31%). <b>Agendar</b> e <b>mandar print</b> são saídas que não negam o Pix. Na Starling, a análise de print triplicou o cancelamento de pagamentos arriscados.</p>${cite('feb','star')}`);
  if (risky) vibrate(V.check);
  $('cancel').onclick = () => done('cancel');
  $('later').onclick = () => done('later');
  $('print').onclick = printSheet;
  hold($('pay'), 3000, () => done('paid'));
}
function printSheet(){
  const sc=document.createElement('div'); sc.className='scrim';
  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Análise de print">
    <div class="grip"></div><h2>Analisando o print…</h2><p class="muted">Lendo a conversa (simulação)</p></div>`;
  phone.appendChild(sc);
  setTimeout(()=>{
    if(!sc.isConnected) return;
    vibrate(V.check);
    sc.querySelector('.sheet').innerHTML=`<div class="grip"></div>
      <h2>Achamos 3 sinais de golpe</h2>
      <div class="sig">Número que não está nos seus contatos</div>
      <div class="sig">Pedido de urgência: “preciso agora”</div>
      <div class="sig">A conta não é do ${PIX.primeiro}</div>
      <button class="btn b-primary" id="sc">Cancelar Pix</button>
      <button class="btn b-text" id="sb">Voltar</button>`;
    $('sc').onclick=()=>done('cancel'); $('sb').onclick=()=>sc.remove();
  },1600);
}

/* ---------- Resultado ---------- */
function done(kind){
  const R = {
    cancel:{ icon:ICON.check, h:'Pix cancelado', p:'Seu dinheiro tá seguro.', v:V.ok },
    later: { icon:ICON.clock, h:'Pix agendado', p:'Dá pra cancelar até lá.', v:V.ok },
    paid:  { icon:ICON.check, h:'Pix enviado', p:'Caiu em golpe? Conteste no app o quanto antes.', v:V.tap }
  }[kind];
  show(`<section class="screen"><div class="grow"></div>
    <div class="av" style="width:72px;height:72px">${R.icon}</div>
    <h1>${R.h}</h1><p class="muted">${R.p}</p>
    <div class="grow"></div>
    <button class="btn b-primary" id="again">Simular de novo</button>
  </section>`, '',
  kind==='paid'
    ? `<p>Se foi golpe, o MED 2.0 (obrigatório desde fev/2026) permite rastrear e bloquear o dinheiro em mais de uma conta.</p>${cite('med')}`
    : `<p>Cancelar ou adiar sem culpa. Essas saídas mantiveram o efeito mesmo depois de várias exposições (−94% no 3º golpe), enquanto avisos de texto perderam força.</p>${cite('notts')}`);
  vibrate(R.v);
  $('again').onclick=home;
}

home();
</script>
