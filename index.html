<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5ec8f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Corrida da Lara 🏎️</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- Botões durante a corrida -->
    <button id="pause-btn" class="round-btn hidden" aria-label="Pausar">❚❚</button>
    <button id="item-btn" class="hidden" aria-label="Usar item"><span id="item-icon"></span><span id="item-count"></span></button>

    <!-- Tela inicial -->
    <div id="title-screen" class="screen">
      <div class="logo">
        <div class="logo-top">🏁 Corrida da</div>
        <div class="logo-name">LARA</div>
        <div class="logo-sub">Kart Arco-Íris 🌈</div>
      </div>
      <button id="cup-btn" class="big-btn">🏆 COPA</button>
      <button id="free-btn" class="big-btn blue">🏁 CORRIDA LIVRE</button>
      <div id="trophy-shelf"></div>
      <button id="mute-btn" class="round-btn corner" aria-label="Som">🔊</button>
    </div>

    <!-- Monte seu kart -->
    <div id="setup-screen" class="screen hidden">
      <h2>Quem vai correr?</h2>
      <div id="char-picker" class="picker"></div>
      <h2>Cor do kart</h2>
      <div id="car-picker" class="picker"></div>
      <h2>Velocidade</h2>
      <div id="cc-picker" class="picker"></div>
      <button id="setup-go" class="big-btn">PRÓXIMO ▶</button>
      <button class="link-btn" data-go="title">◀ Voltar</button>
    </div>

    <!-- Escolha de pista -->
    <div id="track-screen" class="screen hidden">
      <h2>Escolha a pista</h2>
      <div id="track-picker" class="cards"></div>
      <button class="link-btn" data-go="setup">◀ Voltar</button>
    </div>

    <!-- Resultado / troféu -->
    <div id="results-screen" class="screen hidden">
      <div id="res-medal">🥇</div>
      <h1 id="res-title"></h1>
      <p id="res-sub" class="sub"></p>
      <div id="res-table"></div>
      <button id="res-next" class="big-btn"></button>
      <button id="res-alt" class="link-btn hidden"></button>
      <button id="res-menu" class="link-btn">🏠 Menu</button>
    </div>

    <!-- Pausa -->
    <div id="pause-screen" class="screen hidden">
      <h1>⏸ Pausa</h1>
      <button id="resume-btn" class="big-btn">CONTINUAR ▶</button>
      <button id="quit-btn" class="link-btn">🏠 Sair da corrida</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
