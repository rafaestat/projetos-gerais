<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5ec8f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Carrinho da Lara 🚗</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- Tela inicial -->
    <div id="start-screen" class="screen">
      <h1>🏁 Corrida da Lara</h1>
      <p class="sub">Uma corrida de kart! Escolha sua cor, Lara! 💖</p>
      <div id="car-picker"></div>
      <button id="play-btn" class="big-btn">CORRER ▶</button>
      <p class="hint">Arraste o dedo para dirigir 👆<br>Pegue ⭐, passe no turbo 🔥 e ultrapasse todo mundo!</p>
    </div>

    <!-- HUD durante o jogo -->
    <div id="hud" class="hidden">
      <div id="pos">🏅 4º</div>
      <div id="lap">🏁 1/3</div>
      <div id="score">⭐ 0</div>
    </div>

    <!-- Tela de fim de corrida -->
    <div id="over-screen" class="screen hidden">
      <div id="over-medal">🥇</div>
      <h1 id="over-title">LARA CAMPEÃ! 🏆</h1>
      <p class="sub" id="over-score">Você chegou em 1º lugar!</p>
      <button id="again-btn" class="big-btn">CORRER DE NOVO 🔄</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
